{% extends "base.html" %}
{% block title %}Scanner — balsp{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Scanner d'invitations</h1>

<div class="row">
  <div class="col-lg-6 mb-4">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Caméra</span>
        <button id="btn-toggle" class="btn btn-sm btn-outline-primary">Démarrer</button>
      </div>
      <div class="card-body">
        <div id="qr-reader" style="width:100%;"></div>
        <div class="mt-3">
          <label class="form-label small text-muted">Saisie manuelle du token</label>
          <div class="input-group">
            <input type="text" id="manual-token" class="form-control" placeholder="UUID du QR code">
            <button class="btn btn-outline-secondary" id="btn-manual">Vérifier</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div id="result-card" class="card d-none">
      <div class="card-body text-center">
        <img id="result-logo" alt="" class="mb-3" style="max-height:80px; display:none;">
        <h3 id="result-name" class="mb-1">—</h3>
        <div id="result-tier" class="text-muted mb-3">—</div>

        <div class="display-4">
          <span id="result-entries">0</span> / <span id="result-total">0</span>
        </div>
        <div class="text-muted small">entrées enregistrées</div>

        <div class="progress my-3" style="height: 12px;">
          <div id="result-progress" class="progress-bar" style="width: 0%"></div>
        </div>

        <div id="result-message" class="alert d-none"></div>

        <div id="result-guests" class="text-start mt-3 d-none">
          <h6>Invités nominatifs</h6>
          <ul id="guest-list" class="list-group list-group-flush mb-2"></ul>
        </div>

        <div class="d-flex gap-2 justify-content-center mt-3">
          <div class="input-group" style="max-width: 160px;">
            <input type="number" id="checkin-count" class="form-control" value="1" min="1">
            <button id="btn-checkin" class="btn btn-success">+ Entrée</button>
          </div>
          <button id="btn-undo" class="btn btn-outline-warning">Annuler dernier</button>
        </div>
        <button id="btn-reset" class="btn btn-link mt-2">Scanner un autre QR</button>
      </div>
    </div>
    <div id="placeholder" class="text-center text-muted py-5">
      Présentez un QR code à la caméra pour commencer.
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.10/html5-qrcode.min.js"></script>
<script src="{{ url_for('static', filename='js/scanner.js') }}"></script>
{% endblock %}
