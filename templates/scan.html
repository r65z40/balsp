{% extends "base.html" %}
{% block title %}Scanner — Bal des Pompiers{% endblock %}
{% block content %}

<!-- SECTION SCANNER (caméra + saisie manuelle) -->
<div id="scanner-section">
  <h1 class="h3 mb-3">&#x1F6A8; Scanner d'invitations</h1>
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Caméra</span>
          <button id="btn-toggle" class="btn btn-sm btn-outline-primary">Démarrer</button>
        </div>
        <div class="card-body p-2 p-sm-3">
          <div id="qr-reader" style="width:100%;"></div>
          <hr>
          <label class="form-label small text-muted">Ou saisie manuelle du token</label>
          <div class="input-group">
            <input type="text" id="manual-token" class="form-control" placeholder="UUID du QR code">
            <button class="btn btn-outline-secondary" id="btn-manual">Vérifier</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SECTION RÉSULTAT -->
<div id="result-section" class="d-none">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">

      <!-- Info sponsor + compteur global -->
      <div class="card mb-3">
        <div class="card-body text-center py-3">
          <img id="result-logo" alt="" class="mb-2" style="max-height:60px; display:none;">
          <h2 id="result-name" class="h4 mb-1">—</h2>
          <div id="result-tier" class="text-muted small mb-2">—</div>

          <div class="display-5">
            <span id="result-entries">0</span> / <span id="result-total">0</span>
          </div>
          <div class="text-muted small mb-1">personnes arrivées</div>

          <div class="progress my-2" style="height: 10px;">
            <div id="result-progress" class="progress-bar" style="width: 0%"></div>
          </div>

          <div id="result-message" class="alert d-none mt-2 mb-0"></div>
        </div>
      </div>

      <!-- Invitation scannée : action principale -->
      <div id="current-invitation" class="card mb-3 d-none">
        <div class="card-header py-2">
          <strong>Invitation n°<span id="current-number">—</span></strong>
          <span id="current-status" class="badge ms-2">—</span>
        </div>
        <div class="card-body py-3">
          <div class="mb-3">
            <label class="form-label small">Nom de l'invité <span class="text-muted">(facultatif)</span></label>
            <input type="text" id="guest-name" class="form-control" placeholder="Ex: Jean Dupont">
            <div class="form-text">Nom actuel : <strong><span id="current-name">—</span></strong></div>
          </div>
          <div class="d-flex gap-2">
            <button id="btn-checkin" class="btn btn-success btn-lg flex-grow-1">
              &#x2713; Pointer
            </button>
            <button id="btn-undo" class="btn btn-outline-warning d-none">
              Annuler
            </button>
          </div>
        </div>
      </div>

      <!-- Liste des invitations du sponsor -->
      <div class="card mb-3">
        <div class="card-header py-2"><strong>Invitations du sponsor</strong></div>
        <ul id="invitation-list" class="list-group list-group-flush"></ul>
      </div>

      <!-- Bouton rescanner -->
      <div class="text-center mb-4">
        <button id="btn-rescan" class="btn btn-primary btn-lg w-100">
          &#x1F4F7; Scanner un autre QR code
        </button>
      </div>

    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="{{ url_for('static', filename='js/scanner.js') }}"></script>
{% endblock %}
