{% extends "base.html" %}
{% block title %}Scanner — Bal des Pompiers{% endblock %}
{% block content %}

<!-- SECTION SCANNER (caméra + saisie manuelle) -->
<div id="scanner-section">
  <h1 class="h3 mb-4">&#x1F6A8; Scanner d'invitations</h1>
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Caméra</span>
          <button id="btn-toggle" class="btn btn-sm btn-outline-primary">Démarrer</button>
        </div>
        <div class="card-body">
          <div id="qr-reader" style="width:100%;"></div>
          <hr>
          <label class="form-label small text-muted">Ou saisie manuelle du token</label>
          <div class="input-group">
            <input type="text" id="manual-token" class="form-control" placeholder="UUID du QR code">
            <button class="btn btn-outline-secondary" id="btn-manual">Vérifier</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SECTION RÉSULTAT (formulaire check-in, caméra cachée) -->
<div id="result-section" class="d-none">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card mb-4">
        <div class="card-body text-center">
          <img id="result-logo" alt="" class="mb-3" style="max-height:80px; display:none;">
          <h2 id="result-name" class="mb-1">—</h2>
          <div id="result-tier" class="text-muted mb-2">—</div>

          <div class="display-4">
            <span id="result-entries">0</span> / <span id="result-total">0</span>
          </div>
          <div class="text-muted small mb-2">entrées enregistrées</div>

          <div class="progress my-3" style="height: 12px;">
            <div id="result-progress" class="progress-bar" style="width: 0%"></div>
          </div>

          <div id="result-message" class="alert d-none"></div>
        </div>
      </div>

      <!-- Invités nominatifs existants -->
      <div id="result-guests" class="card mb-4 d-none">
        <div class="card-header"><strong>Invités nominatifs</strong></div>
        <ul id="guest-list" class="list-group list-group-flush"></ul>
      </div>

      <!-- Formulaire de check-in -->
      <div class="card mb-4">
        <div class="card-header"><strong>Enregistrer une entrée</strong></div>
        <div class="card-body">
          <div class="mb-3">
            <label for="guest-name" class="form-label">Nom de l'invité <span class="text-muted">(facultatif)</span></label>
            <input type="text" id="guest-name" class="form-control" placeholder="Ex: Jean Dupont">
          </div>
          <div class="row align-items-end">
            <div class="col-auto">
              <label for="checkin-count" class="form-label">Nombre</label>
              <input type="number" id="checkin-count" class="form-control" value="1" min="1" style="width: 80px;">
            </div>
            <div class="col">
              <button id="btn-checkin" class="btn btn-success btn-lg w-100">+ Enregistrer l'entrée</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Annuler -->
      <div class="d-flex justify-content-between mb-4">
        <button id="btn-undo" class="btn btn-outline-warning">Annuler le dernier pointage</button>
      </div>

      <!-- Bouton rescanner -->
      <div class="text-center mb-5">
        <button id="btn-rescan" class="btn btn-primary btn-lg">
          &#x1F4F7; Scanner un autre QR code
        </button>
      </div>

    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="{{ url_for('static', filename='js/scanner.js') }}"></script>
{% endblock %}
